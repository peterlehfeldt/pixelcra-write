<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>write · the broken pilot</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #030810; --panel: #070f1e; --border: #0d2240;
  --accent: #00ffe7; --accent2: #ff3c6e; --accent3: #ffe600;
  --text: #a8cce0; --dim: #334d66;
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
header {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  flex-shrink: 0; font-size: 12px;
}
header .title { color: var(--accent); letter-spacing: 2px; font-weight: bold; }
header .meta { color: var(--dim); flex: 1; }
header .meta .dirty { color: var(--accent3); }
header .meta .err { color: var(--accent2); }
header .sha { color: var(--accent); opacity: 0.7; font-size: 11px; }
header button {
  background: #040c1a; border: 1px solid var(--border); color: var(--text);
  font-family: inherit; font-size: 12px; padding: 6px 14px; border-radius: 3px;
  cursor: pointer;
}
header button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
header button:disabled { opacity: 0.4; cursor: not-allowed; }
header button.dirty { border-color: var(--accent3); color: var(--accent3); }
#editor {
  flex: 1; min-height: 0;
  background: var(--bg); color: var(--text);
  font-family: inherit; font-size: 14px; line-height: 1.6;
  border: none; outline: none; resize: none;
  padding: 18px 22px; width: 100%;
}
#editor:disabled { opacity: 0.5; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="title">⟆ WRITE</span>
    <span class="meta" id="meta">loading…</span>
    <span class="sha" id="sha"></span>
    <button id="saveBtn" disabled>SAVE</button>
  </header>
  <textarea id="editor" spellcheck="false" disabled placeholder="loading…"></textarea>
</div>
<script>
const editor = document.getElementById('editor');
const meta   = document.getElementById('meta');
const shaEl  = document.getElementById('sha');
const saveBtn= document.getElementById('saveBtn');

let savedContent = '';
let sha = null;
let lastSaveAt = null;
let saving = false;

function fmtRel(ts) {
  if (!ts) return '';
  const s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
  if (s < 60)  return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  if (s < 86400) return `${Math.floor(s/3600)}h ago`;
  return `${Math.floor(s/86400)}d ago`;
}

function renderMeta(state, extra) {
  const dirty = editor.value !== savedContent;
  saveBtn.classList.toggle('dirty', dirty);
  saveBtn.disabled = saving || !dirty;
  if (state === 'loading')  { meta.innerHTML = 'loading…'; return; }
  if (state === 'saving')   { meta.innerHTML = 'saving…'; return; }
  if (state === 'error')    { meta.innerHTML = `<span class="err">${extra || 'error'}</span>`; return; }
  if (state === 'conflict') { meta.innerHTML = `<span class="err">remote changed — reload to pull latest</span>`; return; }
  const dot = dirty ? ' <span class="dirty">·</span>' : '';
  meta.innerHTML = lastSaveAt
    ? `saved ${fmtRel(lastSaveAt)}${dot}`
    : `loaded${dot}`;
}

async function loadFile() {
  renderMeta('loading');
  try {
    const r = await fetch('/api/file', { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}: ${await r.text()}`);
    const j = await r.json();
    savedContent = j.content;
    sha = j.sha;
    editor.value = savedContent;
    editor.disabled = false;
    shaEl.textContent = sha ? `sha ${sha.slice(0,7)}` : '';
    lastSaveAt = null;
    renderMeta('idle');
  } catch (e) {
    renderMeta('error', e.message);
  }
}

async function saveFile() {
  if (saving) return;
  if (editor.value === savedContent) return;
  saving = true;
  renderMeta('saving');
  try {
    const r = await fetch('/api/file', {
      method: 'PUT',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ sha, content: editor.value }),
    });
    if (r.status === 409 || r.status === 422) {
      saving = false;
      renderMeta('conflict');
      return;
    }
    if (!r.ok) throw new Error(`HTTP ${r.status}: ${await r.text()}`);
    const j = await r.json();
    sha = j.sha;
    savedContent = editor.value;
    lastSaveAt = Date.now();
    shaEl.textContent = `sha ${sha.slice(0,7)}`;
    saving = false;
    renderMeta('idle');
  } catch (e) {
    saving = false;
    renderMeta('error', e.message);
  }
}

editor.addEventListener('input', () => renderMeta('idle'));
saveBtn.addEventListener('click', saveFile);
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveFile();
  }
});
window.addEventListener('beforeunload', (e) => {
  if (editor.value !== savedContent) {
    e.preventDefault();
    e.returnValue = '';
  }
});

setInterval(() => { if (lastSaveAt) renderMeta('idle'); }, 15000);

loadFile();
</script>
</body>
</html>
