<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>write · the broken pilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* pixelcra.sh — bone palette, JetBrains Mono. Driven by homepage. */
:root {
  --bg: #161514;
  --bg-deep: #0e0d0c;
  --bg-glow: #221f1d;
  --panel: #0e0d0c;
  --border: rgba(232, 220, 198, 0.16);
  --accent: #e8dcc6;
  --accent2: #c25a3e;
  --accent3: #d4b896;
  --text: #ece4d4;
  --dim: rgba(236, 228, 212, 0.5);
  --glow: rgba(232,220,198,0.35);
  --pix-font: 'JetBrains Mono', ui-monospace, Menlo, monospace;
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--pix-font); }
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

header {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  flex-shrink: 0; font-size: 12px;
}

/* shared home-link chrome */
.px-home {
  display: inline-flex; align-items: baseline; gap: 6px;
  font-family: var(--pix-font); font-weight: 600; font-size: 14px;
  color: var(--accent); text-decoration: none; letter-spacing: -0.02em;
  text-shadow: 0 0 14px var(--glow);
}
.px-home:hover { opacity: 0.85; }
.px-home .px-g { opacity: 0.6; }
.px-home .px-d { color: var(--accent3); }
.px-home .px-c {
  display: inline-block; width: 8px; height: 14px;
  background: currentColor; transform: translateY(2px);
  box-shadow: 0 0 10px var(--glow);
}
.px-sep { color: var(--dim); margin: 0 4px; }
.px-slug { color: var(--text); opacity: 0.85; letter-spacing: 2px; text-transform: lowercase; font-weight: 500; font-size: 13px; }

header .meta { color: var(--dim); flex: 1; }
header .meta .dirty { color: var(--accent3); }
header .meta .err { color: var(--accent2); }
header .sha { color: var(--accent); opacity: 0.7; font-size: 11px; }
header button {
  background: var(--bg-deep); border: 1px solid var(--border); color: var(--text);
  font-family: var(--pix-font); font-size: 12px; padding: 6px 14px; border-radius: 3px;
  cursor: pointer;
}
header button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
header button:disabled { opacity: 0.4; cursor: not-allowed; }
header button.dirty { border-color: var(--accent3); color: var(--accent3); }
#editor {
  flex: 1; min-height: 0;
  background: var(--bg); color: var(--text);
  font-family: var(--pix-font); font-size: 14px; line-height: 1.7;
  border: none; outline: none; resize: none;
  padding: 24px 28px; width: 100%;
}
#editor:disabled { opacity: 0.5; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div style="display:flex;align-items:baseline;gap:10px;min-width:0;">
      <a class="px-home" href="https://pixelcra.sh" title="back to pixelcra.sh"><span class="px-g">&gt;</span>pixelcra<span class="px-d">.</span>sh<span class="px-c"></span></a>
      <span class="px-sep">/</span>
      <span class="px-slug">write</span>
    </div>
    <span class="meta" id="meta">loading…</span>
    <span class="sha" id="sha"></span>
    <button id="saveBtn" disabled>SAVE</button>
  </header>
  <textarea id="editor" spellcheck="false" disabled placeholder="loading…"></textarea>
</div>
<script>
const editor = document.getElementById('editor');
const meta   = document.getElementById('meta');
const shaEl  = document.getElementById('sha');
const saveBtn= document.getElementById('saveBtn');

let savedContent = '';
let sha = null;
let lastSaveAt = null;
let saving = false;

function fmtRel(ts) {
  if (!ts) return '';
  const s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
  if (s < 60)  return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  if (s < 86400) return `${Math.floor(s/3600)}h ago`;
  return `${Math.floor(s/86400)}d ago`;
}

function renderMeta(state, extra) {
  const dirty = editor.value !== savedContent;
  saveBtn.classList.toggle('dirty', dirty);
  saveBtn.disabled = saving || !dirty;
  if (state === 'loading')  { meta.innerHTML = 'loading…'; return; }
  if (state === 'saving')   { meta.innerHTML = 'saving…'; return; }
  if (state === 'error')    { meta.innerHTML = `<span class="err">${extra || 'error'}</span>`; return; }
  if (state === 'conflict') { meta.innerHTML = `<span class="err">remote changed — reload to pull latest</span>`; return; }
  const dot = dirty ? ' <span class="dirty">·</span>' : '';
  meta.innerHTML = lastSaveAt
    ? `saved ${fmtRel(lastSaveAt)}${dot}`
    : `loaded${dot}`;
}

async function loadFile() {
  renderMeta('loading');
  try {
    const r = await fetch('/api/file', { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}: ${await r.text()}`);
    const j = await r.json();
    savedContent = j.content;
    sha = j.sha;
    editor.value = savedContent;
    editor.disabled = false;
    shaEl.textContent = sha ? `sha ${sha.slice(0,7)}` : '';
    lastSaveAt = null;
    renderMeta('idle');
  } catch (e) {
    renderMeta('error', e.message);
  }
}

async function saveFile() {
  if (saving) return;
  if (editor.value === savedContent) return;
  saving = true;
  renderMeta('saving');
  try {
    const r = await fetch('/api/file', {
      method: 'PUT',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ sha, content: editor.value }),
    });
    if (r.status === 409 || r.status === 422) {
      saving = false;
      renderMeta('conflict');
      return;
    }
    if (!r.ok) throw new Error(`HTTP ${r.status}: ${await r.text()}`);
    const j = await r.json();
    sha = j.sha;
    savedContent = editor.value;
    lastSaveAt = Date.now();
    shaEl.textContent = `sha ${sha.slice(0,7)}`;
    saving = false;
    renderMeta('idle');
  } catch (e) {
    saving = false;
    renderMeta('error', e.message);
  }
}

editor.addEventListener('input', () => renderMeta('idle'));
saveBtn.addEventListener('click', saveFile);
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveFile();
  }
});
window.addEventListener('beforeunload', (e) => {
  if (editor.value !== savedContent) {
    e.preventDefault();
    e.returnValue = '';
  }
});

setInterval(() => { if (lastSaveAt) renderMeta('idle'); }, 15000);

loadFile();
</script>
</body>
</html>
